    // =========================================================================
    // مكون عرض السعر بأسلوب المتاجر العالمية (SHEIN Price Typography)
    // الرقم الرئيسي بخط عريض (800) والكسور العشرية أصغر مع رمز الريال الرسمي
    // =========================================================================
    function PriceTag({ 
      price, 
      size = "md", 
      className = "text-[#c40d00]", 
      showDecimals = true,
      originalPrice = null 
    }) {
      if (price === null || price === undefined || isNaN(Number(price)) || Number(price) <= 0) {
        return (
          <span className="text-xs font-bold text-zinc-500 bg-zinc-100 px-2 py-0.5 rounded-md">
            حسب الطلب
          </span>
        );
      }

      const num = Number(price);
      const intPart = Math.floor(num);
      const decPart = (num % 1 !== 0) ? (num - intPart).toFixed(2).slice(1) : (showDecimals ? '.00' : '');

      let intClass = "text-base";
      let decClass = "text-[11px]";
      let symClass = "w-3 h-3";

      if (size === "xs") {
        intClass = "text-[10px]";
        decClass = "text-[8px]";
        symClass = "w-2.5 h-2.5";
      } else if (size === "sm") {
        intClass = "text-xs";
        decClass = "text-[9px]";
        symClass = "w-2.5 h-2.5";
      } else if (size === "md") {
        intClass = "text-sm";
        decClass = "text-[10px]";
        symClass = "w-3 h-3";
      } else if (size === "lg") {
        intClass = "text-base sm:text-lg";
        decClass = "text-xs";
        symClass = "w-3.5 h-3.5";
      }

      return (
        <span className={`inline-flex items-baseline gap-0.5 ${className}`} dir="ltr">
          <span className={`${intClass} font-[800] tracking-tight leading-none`}>
            {intPart}
          </span>
          {decPart && (
            <span className={`${decClass} font-bold opacity-80 leading-none`}>
              {decPart}
            </span>
          )}
          <span className="inline-flex items-center ml-0.5 text-current self-center" dir="rtl">
            <SarSymbol className={symClass} />
          </span>
          {originalPrice && Number(originalPrice) > num && (
            <span className="text-[10px] text-zinc-400 line-through mr-1 font-normal" dir="ltr">
              {Number(originalPrice).toFixed(0)}
            </span>
          )}
        </span>
      );
    }

      // -----------------------------------------------------------------------
      const playTone = (ctx, freq, duration, gainVal = 0.25) => {
        try {
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {
          console.warn("playTone error:", e);
        }
      };

      const enableAudioAlerts = () => {

          if (!AudioContextClass) {
            showToast("متصفحك لا يدعم تشغيل التنبيهات الصوتية", "error");
            return;
          }
          if (!audioCtxRef.current) {
            audioCtxRef.current = new AudioContextClass();
          }
          if (audioCtxRef.current.state === 'suspended') {
            audioCtxRef.current.resume();
          }

          // نغمة اختبارية خفيفة للتأكيد وتجاوز حظر المتصفح للتشغيل التلقائي
          playTone(audioCtxRef.current, 523.25, 0.15, 0.2); // C5
          setTimeout(() => {

          // رنة جرس طلب جديد بارزة وأنيقة (Chime: D5 -> A5 -> D6)
          playTone(ctx, 587.33, 0.22, 0.35); // D5

      useEffect(() => {

        const ordersChannel = supabaseClient

            { event: 'INSERT', schema: 'public', table: 'orders' },
            (payload) => {
              const newOrder = payload.new;
              if (!newOrder) return;

              // إضافة الطلب فوراً في أعلى القائمة دون الحاجة لتحديث الصفحة
              setOrders(prev => {
                const exists = prev.some(o => o.id === newOrder.id || (o.order_code && o.order_code === newOrder.order_code));

                return [newOrder, ...prev];

            }
          )
          .on(
            'postgres_changes',
            { event: 'UPDATE', schema: 'public', table: 'orders' },
            (payload) => {
              const updated = payload.new;
              if (!updated) return;

              setOrders(prev => prev.map(o => o.id === updated.id ? { ...o, ...updated } : o));

        return () => {
          supabaseClient.removeChannel(ordersChannel);
          clearInterval(pollingTimer);
        };
      }, [session, supabaseClient, audioAlertsEnabled]);

                const cleanName = file.name.substring(0, 10).replace(/[^a-zA-Z0-9]/g, '_');

                const { error: uploadErr } = await supabaseClient.storage
                  .from('products-images')

                if (!uploadErr) {
                  const { data: publicUrlData } = supabaseClient.storage

              .update(payload)
              .eq('id', prodId);

              const retry = await supabaseClient.from('products').update(payload).eq('id', prodId);

            }]);
          if (error) throw error;
          showToast("تمت إضافة قاعدة الربط بنجاح");
          setNewRuleTargetCat('');
          await loadComplementsData();
        } catch (err) {
          console.error("Add rule error:", err);
          showToast("تعذر إضافة القاعدة: " + err.message, "error");
        } finally {
          setIsAddingRule(false);
        }
      };

      const handleDeleteCategoryRule = async (ruleId) => {
        if (!confirm("هل أنت متأكد من حذف قاعدة الربط هذه؟")) return;
        try {
          const { error } = await supabaseClient
            .from('category_complement_rules')
            .delete()
            .eq('id', ruleId);
          if (error) throw error;
          showToast("تم حذف قاعدة الربط بنجاح");
          await loadComplementsData();
        } catch (err) {
          showToast("تعذر حذف القاعدة: " + err.message, "error");
        }
      };

      // حسابات نموذج الباقة (إجمالي الأسعار الفردية ومقدار التوفير التلقائي)
      const bundleSelectedProducts = useMemo(() => {
        return products.filter(p => bundleFormProductIds.includes(p.id));
      }, [products, bundleFormProductIds]);

      const bundleOriginalTotal = useMemo(() => {
        return bundleSelectedProducts.reduce((sum, p) => sum + (Number(p.price) || 0), 0);
      }, [bundleSelectedProducts]);

      const bundleSavings = useMemo(() => {
        const finalP = Number(bundleFormPrice) || 0;
        if (bundleOriginalTotal > 0 && finalP > 0 && bundleOriginalTotal > finalP) {
          const diff = bundleOriginalTotal - finalP;
          const percent = Math.round((diff / bundleOriginalTotal) * 100);
          return { diff, percent };
        }
        return null;
      }, [bundleOriginalTotal, bundleFormPrice]);

      // جلب الباقات ومشتملاتها من Supabase
      const loadBundlesData = async () => {
        if (!supabaseClient) return;
        setLoadingBundlesData(true);
        try {
          const { data: bundlesData, error: bErr } = await supabaseClient
            .from('product_bundles')
            .select('*')
            .order('created_at', { ascending: false });

          const { data: items, error: itmErr } = await supabaseClient
            .from('product_bundle_items')
            .select('*');

          if (!bErr && bundlesData) {
            const itemsMap = {};
            (items || []).forEach(it => {
              if (!itemsMap[it.bundle_id]) itemsMap[it.bundle_id] = [];
              itemsMap[it.bundle_id].push(it.product_id);
            });
            const enriched = bundlesData.map(b => ({
              ...b,
              productIds: itemsMap[b.id] || []
            }));
            setBundles(enriched);
          }
        } catch (err) {
          console.warn("Bundles data load warning:", err);
        } finally {
          setLoadingBundlesData(false);
        }
      };

      const openNewBundleModal = () => {
        setEditingBundle(null);
        setBundleFormTitle('');
        setBundleFormPrice('');
        setBundleFormIsActive(true);
        setBundleFormProductIds([]);
        setBundleProductSearch('');
        setBundleModalOpen(true);
      };

      const openCreateBundleModal = openNewBundleModal;

      const openEditBundleModal = (bundle) => {
        setEditingBundle(bundle);
        setBundleFormTitle(bundle.title || '');
        setBundleFormPrice(bundle.bundle_price !== undefined ? String(bundle.bundle_price) : '');
        setBundleFormIsActive(bundle.is_active !== false);
        setBundleFormProductIds(bundle.productIds ? [...bundle.productIds] : []);
        setBundleProductSearch('');
        setBundleModalOpen(true);
      };

      const toggleBundleProduct = (prodId) => {
        setBundleFormProductIds(prev => 
          prev.includes(prodId) ? prev.filter(id => id !== prodId) : [...prev, prodId]
        );
      };

      const handleSaveBundle = async (e) => {
        e?.preventDefault?.();
        if (!bundleFormTitle.trim()) {
          showToast('يرجى إدخال اسم الباقة أو الطقم', 'error');
          return;
        }
        if (bundleFormProductIds.length < 2) {
          showToast('يرجى اختيار منتجين على الأقل لتكوين الباقة', 'error');
          return;
        }
        const parsedPrice = Number(bundleFormPrice);
        if (isNaN(parsedPrice) || parsedPrice <= 0) {
          showToast('يرجى تحديد سعر نهائي صحيح للباقة (أكبر من 0)', 'error');
          return;
        }

        setIsSavingBundle(true);
        try {
          if (!supabaseClient) throw new Error('الاتصال بقاعدة البيانات غير متوفر');

          let bundleId = editingBundle?.id;

          if (editingBundle) {
            const { error: updErr } = await supabaseClient
              .from('product_bundles')
              .update({
                title: bundleFormTitle.trim(),
                bundle_price: parsedPrice,
                is_active: bundleFormIsActive
              })
              .eq('id', bundleId);

            if (updErr) throw updErr;

            await supabaseClient
              .from('product_bundle_items')
              .delete()
              .eq('bundle_id', bundleId);
          } else {
            const { data: newBundle, error: insErr } = await supabaseClient
              .from('product_bundles')
              .insert([{
                title: bundleFormTitle.trim(),
                bundle_price: parsedPrice,
                is_active: bundleFormIsActive
              }])
              .select()
              .single();

            if (insErr) throw insErr;
            bundleId = newBundle.id;
          }

          if (bundleFormProductIds.length > 0 && bundleId) {
            const itemsToInsert = bundleFormProductIds.map(pId => ({
              bundle_id: bundleId,
              product_id: pId
            }));
            const { error: itemsErr } = await supabaseClient
              .from('product_bundle_items')
              .insert(itemsToInsert);

            if (itemsErr) throw itemsErr;
          }

          showToast(editingBundle ? 'تم تحديث الباقة بنجاح' : 'تم إنشاء الباقة بنجاح');
          setBundleModalOpen(false);
          await loadBundlesData();
        } catch (err) {
          console.error('Save bundle error:', err);
          showToast('حدث خطأ أثناء حفظ الباقة: ' + (err.message || 'فشلت العملية'), 'error');
        } finally {
          setIsSavingBundle(false);
        }
      };

      const handleToggleBundleActive = async (bundle) => {
        if (!supabaseClient) return;
        const newStatus = !bundle.is_active;
        setBundles(prev => prev.map(b => b.id === bundle.id ? { ...b, is_active: newStatus } : b));
        try {
          const { error } = await supabaseClient
            .from('product_bundles')
            .update({ is_active: newStatus })
            .eq('id', bundle.id);

          if (error) throw error;
          showToast(newStatus ? 'تم تفعيل الباقة للعملاء ✓' : 'تم إيقاف تفعيل الباقة مؤقتاً');
        } catch (err) {
          setBundles(prev => prev.map(b => b.id === bundle.id ? { ...b, is_active: !newStatus } : b));
          console.error('Toggle bundle active error:', err);
          showToast('فشل تغيير حالة الباقة', 'error');
        }
      };

      const handleDeleteBundle = async (bundle) => {
        if (!confirm(`هل أنت متأكد من حذف الباقة "${bundle.title}" نهائياً؟`)) return;
        if (!supabaseClient) return;
        try {
          const { error } = await supabaseClient
            .from('product_bundles')
            .delete()
            .eq('id', bundle.id);

          if (error) throw error;
          setBundles(prev => prev.filter(b => b.id !== bundle.id));
          showToast('تم حذف الباقة بنجاح ✓');
        } catch (err) {
          console.error('Delete bundle error:', err);
          showToast('فشل حذف الباقة: ' + (err.message || ''), 'error');
        }
      };

      // =========================================================================
      // دوال إدارة الخدمات (Services Management)
      // =========================================================================
      const loadServicesData = async () => {
        if (!supabaseClient) return;
        setServicesLoading(true);
        try {
          const { data, error } = await supabaseClient
            .from('services')
            .select('*')
            .order('sort_order', { ascending: true });
          if (!error && data) {
            setServices(data);
          } else if (error) {
            console.warn('Could not load services table:', error);
          }
        } catch (err) {
          console.warn('loadServicesData caught error:', err);
        } finally {
          setServicesLoading(false);
        }
      };

      const openNewServiceModal = () => {
        setEditingService(null);
        setServiceFormData({
          title: '',
          description: '',
          icon_name: 'sparkles',
          accent_color: '#0284c7',
          media_type: 'none',
          media_url: '',
          linked_category_id: '',
          whatsapp_template: '',
          sort_order: (services.length > 0 ? Math.max(...services.map(s => Number(s.sort_order) || 0)) + 1 : 1),
          is_active: true
        });
        setServiceMediaFile(null);
        setServiceMediaPreview('');
        setServiceModalOpen(true);
      };

      const openEditServiceModal = (service) => {
        setEditingService(service);
        setServiceFormData({
          title: service.title || '',
          description: service.description || '',
          icon_name: service.icon_name || 'sparkles',
          accent_color: service.accent_color || '#0284c7',
          media_type: service.media_type || 'none',
          media_url: service.media_url || '',
          linked_category_id: service.linked_category_id || '',
          whatsapp_template: service.whatsapp_template || '',
          sort_order: service.sort_order ?? 0,
          is_active: service.is_active !== false
        });
        setServiceMediaFile(null);
        setServiceMediaPreview(service.media_url || '');
        setServiceModalOpen(true);
      };

      const handleSaveService = async (e) => {
        e.preventDefault();
        if (!serviceFormData.title.trim()) {
          showToast('يرجى كتابة عنوان الخدمة', 'error');
          return;
        }
        setIsSavingService(true);
        try {
          let finalMediaUrl = serviceFormData.media_url ? serviceFormData.media_url.trim() : null;

          // إذا تم اختيار ملف وسائط (صورة أو فيديو) نرفعه إلى Storage
          if (serviceMediaFile && (serviceFormData.media_type === 'image' || serviceFormData.media_type === 'video')) {
            const ext = serviceMediaFile.name.split('.').pop() || (serviceFormData.media_type === 'video' ? 'mp4' : 'jpg');
            const path = `services/serv_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${ext}`;
            const { error: upErr } = await supabaseClient.storage
              .from('products-images')
              .upload(path, serviceMediaFile, { upsert: true });
            if (upErr) {
              console.warn('Storage upload error:', upErr);
            } else {
              const { data: pubData } = supabaseClient.storage.from('products-images').getPublicUrl(path);
              if (pubData?.publicUrl) {
                finalMediaUrl = pubData.publicUrl;
              }
            }
          }

          if (serviceFormData.media_type === 'none') {
            finalMediaUrl = null;
          }

          const payload = {
            title: serviceFormData.title.trim(),
            description: serviceFormData.description.trim(),
            icon_name: serviceFormData.icon_name || 'sparkles',
            accent_color: serviceFormData.accent_color || '#0284c7',
            media_type: serviceFormData.media_type,
            media_url: finalMediaUrl,
            linked_category_id: serviceFormData.linked_category_id || null,
            whatsapp_template: serviceFormData.whatsapp_template ? serviceFormData.whatsapp_template.trim() : null,
            sort_order: Number(serviceFormData.sort_order) || 0,
            is_active: serviceFormData.is_active
          };

          if (editingService) {
            const { error } = await supabaseClient
              .from('services')
              .update(payload)
              .eq('id', editingService.id);
            if (error) throw error;
            showToast('تم تحديث الخدمة بنجاح');
          } else {
            const { error } = await supabaseClient
              .from('services')
              .insert([payload]);
            if (error) throw error;
            showToast('تمت إضافة الخدمة الجديدة بنجاح');
          }

          setServiceModalOpen(false);
          await loadServicesData();
        } catch (err) {
          console.error('Save service error:', err);
          showToast('فشل حفظ الخدمة: ' + (err.message || ''), 'error');
        } finally {
          setIsSavingService(false);
        }
      };

      const handleToggleServiceActive = async (service) => {
        if (!supabaseClient) return;
        const newStatus = !service.is_active;
        setServices(prev => prev.map(s => s.id === service.id ? { ...s, is_active: newStatus } : s));
        try {
          const { error } = await supabaseClient
            .from('services')
            .update({ is_active: newStatus })
            .eq('id', service.id);
          if (error) throw error;
          showToast(newStatus ? `تم تفعيل خدمة (${service.title}) ✓` : `تم إخفاء خدمة (${service.title})`);
        } catch (err) {
          setServices(prev => prev.map(s => s.id === service.id ? { ...s, is_active: !newStatus } : s));
          console.error('Toggle service active error:', err);
          showToast('فشل تغيير حالة الخدمة', 'error');
        }
      };

      const handleDeleteService = async (service) => {
        if (!confirm(`هل أنت متأكد من حذف الخدمة "${service.title}" نهائياً من المتجر؟`)) return;
        if (!supabaseClient) return;
        try {
          const { error } = await supabaseClient
            .from('services')
            .delete()
            .eq('id', service.id);
          if (error) throw error;
          setServices(prev => prev.filter(s => s.id !== service.id));
          showToast(`تم حذف خدمة (${service.title}) بنجاح ✓`);
        } catch (err) {
          console.error('Delete service error:', err);
          showToast('فشل حذف الخدمة: ' + (err.message || ''), 'error');
        }
      };

      // تصفية الخدمات بحسب البحث
      const filteredServices = services.filter(s => {
        if (!serviceSearchQuery.trim()) return true;
        const q = serviceSearchQuery.toLowerCase().trim();
        return (s.title && s.title.toLowerCase().includes(q)) || 
               (s.description && s.description.toLowerCase().includes(q));
      });

      // تصفية المنتجات بحسب القسم والبحث
      const filteredProducts = products.filter(p => {
        const matchesCategory = selectedCategoryFilter === 'all' || p.category_id === selectedCategoryFilter;
        const matchesSearch = !searchQuery.trim() || (p.name && p.name.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesCategory && matchesSearch;
      });

      // تصفية الطلبات بحسب المرحلة والبحث
      const filteredOrders = orders.filter(order => {
        if (orderStatusFilter !== 'all' && order.status !== orderStatusFilter) {
          return false;
        }
        if (orderSearchQuery.trim()) {
          const q = orderSearchQuery.trim().toLowerCase();
          const matchCode = (order.order_code || '').toLowerCase().includes(q);
          const matchName = (order.customer_name || '').toLowerCase().includes(q);
          const matchPhone = (order.customer_phone || '').includes(q);
          if (!matchCode && !matchName && !matchPhone) return false;
        }
        return true;
      });

      // تصفية التقييمات بحسب الفلتر والبحث
      const filteredReviews = reviews.filter(rev => {
        if (reviewFilter === 'approved' && !rev.is_approved) return false;
        if (reviewFilter === 'pending' && rev.is_approved) return false;
        if (reviewFilter === 'media' && (!rev.media_urls || rev.media_urls.length === 0)) return false;
        if (reviewSearchQuery.trim()) {
          const q = reviewSearchQuery.trim().toLowerCase();
          const matchName = (rev.customer_name || '').toLowerCase().includes(q);
          const matchCode = (rev.order_code || '').toLowerCase().includes(q);
          const matchComment = (rev.comment || '').toLowerCase().includes(q);
          if (!matchName && !matchCode && !matchComment) return false;
        }
        return true;
      });

      // --- شاشة التحميل الأولية ---
      if (authLoading) {
        return (
          <div className="flex flex-col items-center justify-center min-h-screen p-4 text-center">
            <div className="w-12 h-12 border-4 border-zinc-200 border-t-[#c40d00] rounded-full animate-spin mb-4"></div>
            <p className="text-sm font-bold text-zinc-600">جاري الاتصال بلوحة تحكم المتجر...</p>
          </div>
        );
      }

      // --- شاشة الخطأ إذا لم يتم إعداد المفاتيح بعد ---
      if (!isConfigured) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-zinc-50">
            <div className="max-w-md w-full bg-white rounded-3xl p-6 shadow-xl border border-zinc-200 text-center">
              <div className="w-16 h-16 bg-red-100 text-[#c40d00] rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">
                ⚙️
              </div>
              <h2 className="text-xl font-black text-black mb-2">إعداد اتصال Supabase</h2>
              <p className="text-sm text-zinc-600 mb-6 leading-relaxed">
                لم يتم إدخال مفاتيح الربط في ملف <code className="bg-zinc-100 text-red-600 px-2 py-0.5 rounded font-mono text-xs">supabase-config.js</code> بعد.
              </p>

              <div className="bg-zinc-50 rounded-2xl p-4 text-right text-xs text-zinc-700 mb-6 space-y-2 border border-zinc-200/80">
                <p className="font-bold text-black mb-1">خطوات الربط البسيطة (لمرة واحدة):</p>
                <p>1. افتح مشروعك في <a href="https://supabase.com" target="_blank" className="text-blue-600 underline">supabase.com</a>.</p>
                <p>2. توجه إلى <strong>Project Settings ⚙️ → API</strong>.</p>
                <p>3. انسخ <strong>Project URL</strong> و <strong>anon public key</strong>.</p>
                <p>4. الصقهما في ملف <code className="font-mono text-red-600">supabase-config.js</code>.</p>
                <p>5. نفّذ كود <code className="font-mono text-red-600">supabase_setup.sql</code> في الـ SQL Editor لإنشاء الجداول وصلاحيات رفع الصور.</p>
              </div>

              <a 
                href="index.html" 
                className="block w-full py-3 bg-zinc-900 hover:bg-black text-white text-sm font-bold rounded-2xl transition-all shadow-md"
              >
                ← العودة لمتجر المكتبة
              </a>
            </div>
          </div>
        );
      }

      // --- شاشة تسجيل الدخول (Supabase Auth) ---
      if (!session) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-zinc-100">
            <div className="max-w-md w-full bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-zinc-200/80">
              <div className="text-center mb-6">
                <div className="w-14 h-14 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-[#c40d00] to-red-800 flex items-center justify-center text-white shadow-lg shadow-red-500/20"><IconShield className="w-7 h-7" /></div>
                <h1 className="text-xl sm:text-2xl font-black text-black">لوحة تحكم مسؤول المتجر</h1>
                <p className="text-xs text-zinc-500 mt-1">مكتبة أنوار الواحة • إدارة الأصناف والأقسام</p>
              </div>

              {/* تبديل الوضع بين تسجيل الدخول وإنشاء حساب جديد */}
              <div className="flex bg-zinc-100 p-1 rounded-2xl mb-5">
                <button
                  type="button"
                  onClick={() => { setAuthMode('login'); setAuthError(''); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all cursor-pointer ${
                    authMode === 'login'
                      ? 'bg-white text-zinc-900 shadow-2xs'
                      : 'text-zinc-500 hover:text-zinc-900'
                  }`}
                >
                  تسجيل الدخول
                </button>
                <button
                  type="button"
                  onClick={() => { setAuthMode('signup'); setAuthError(''); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all cursor-pointer ${
                    authMode === 'signup'
                      ? 'bg-white text-zinc-900 shadow-2xs'
                      : 'text-zinc-500 hover:text-zinc-900'
                  }`}
                >
                  إنشاء حساب مسؤول جديد
                </button>
              </div>

              {authError && (
                <div className="bg-red-50 border border-red-200 text-[#c40d00] text-xs font-bold rounded-xl p-3 mb-4 text-center">
                  {authError}
                </div>
              )}

              <form onSubmit={authMode === 'login' ? handleLogin : handleSignUp} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-zinc-700 mb-1.5">البريد الإلكتروني للمسؤول:</label>
                  <input
                    type="email"
                    required
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="admin@example.com"
                    className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:border-[#c40d00] transition-colors"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-zinc-700 mb-1.5">كلمة المرور:</label>
                  <input
                    type="password"
                    required

                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:border-[#c40d00] transition-colors"
                  />
                  {authMode === 'signup' && (
                    <span className="text-[10px] text-zinc-400 mt-1 block">كلمة المرور يجب أن لا تقل عن 6 أحرف/أرقام.</span>

                </div>

                <button

                >
                  {isLoggingIn ? (
                    <>
                      <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                      <span>جاري التحقق...</span>
                    </>
                  ) : authMode === 'login' ? (
                    <span>دخول إلى لوحة التحكم ←</span>
                  ) : (
                    <span>إنشاء حساب والدخول ←</span>
                  )}
                </button>
              </form>

              <div className="mt-6 pt-4 border-t border-zinc-100 flex items-center justify-between text-xs text-zinc-500">
                <a href="index.html" className="font-bold text-zinc-700 hover:text-[#c40d00] transition-colors">
                  ← عرض واجهة الزوار
                </a>
                <span className="inline-flex items-center gap-1.5"><IconShield className="w-3.5 h-3.5 text-emerald-600" /><span>نظام سوبابيز الآمن</span></span>
              </div>
            </div>
          </div>
        );
      }

      // --- واجهة لوحة التحكم الرئيسية بعد تسجيل الدخول ---
      return (
        <div className="min-h-screen pb-24">
          {/* إشعار عائم (Toast) */}
          {toast && (
            <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-3 rounded-2xl shadow-xl text-xs sm:text-sm font-bold flex items-center gap-2 border ${
              toast.type === 'error' ? 'bg-red-600 text-white border-red-700' : 'bg-zinc-900 text-white border-zinc-800'
            }`}>
              <span>{toast.type === 'error' ? <IconX className="w-4 h-4 text-white" /> : <IconCheck className="w-4 h-4 text-emerald-400" />}</span>
              <span>{toast.message}</span>
            </div>

                    className="max-h-[80vh] w-auto max-w-full rounded-2xl object-contain"
                    alt=""
                  />
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('admin-root'));
    root.render(<AdminApp />);
  </script>
</body>
</html>
