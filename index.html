<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>مكتبة أنوار الواحة | Anwar Al Wahah</title>

  <!-- استيراد خط Cairo من Google Fonts بأوزانه الكاملة (400, 500, 600, 700, 800, 900) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
            logo: ['Cairo', 'sans-serif'],
          },
          colors: {
            shein: {
              red: '#fa2c19',
              darkRed: '#c40d00',
              black: '#000000',
              border: '#ebebeb',
            }
          },
          keyframes: {
            slideUp: {
              '0%': { transform: 'translateY(100%)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' }
            }
          },
          animation: {
            'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Supabase JS Client & Store Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <!-- Fallback Mock Data -->
  <script src="products.js"></script>
  <script src="services.js"></script>

  <style>
    /* توحيد الخط الرسمي ليشمل كافة العناصر دون استثناء */
    * {
      font-family: 'Cairo', sans-serif !important;
    }

    html {
      overflow-x: clip;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Cairo', sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #ffffff;
      color: #111111;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      overflow-x: clip;
      min-height: 100vh;
    }

    /* هرمية الأوزان البصرية (Visual Hierarchy) بأسلوب المتاجر العالمية */
    h1,
    h2,
    .font-heading,
    .price-integer {
      font-weight: 800 !important;
      letter-spacing: -0.015em;
    }

    h3,
    h4,
    button,
    .btn-action {
      font-weight: 700 !important;
    }

    p,
    span,
    .text-desc {
      font-weight: 500;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .aspect-tall {
      aspect-ratio: 3 / 4;
    }

    .aspect-extra-tall {
      aspect-ratio: 4 / 5.2;
    }

    .logo-font {
      font-family: 'Cairo', sans-serif !important;
      letter-spacing: 0.12em;
      font-weight: 900 !important;
    }
  </style>
</head>

<body class="bg-[#f6f6f7]">
  <div id="root"></div>

  <!-- Modular React Components (Loaded in strict dependency order) -->
  <script type="text/babel" data-presets="react" src="js/constants.js"></script>
  <script type="text/babel" data-presets="react" src="js/ProductCard.js"></script>
  <script type="text/babel" data-presets="react" src="js/ProductModal.js"></script>
  <script type="text/babel" data-presets="react" src="js/ServicesView.js"></script>
  <script type="text/babel" data-presets="react" src="js/CartDrawer.js"></script>
  <script type="text/babel" data-presets="react" src="js/ProfileOrders.js"></script>
  <script type="text/babel" data-presets="react" src="js/App.js"></script>
</body>

</html>
