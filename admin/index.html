<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تحويل إلى لوحة التحكم...</title>
  <script>
    (function() {
      var base = window.location.pathname.replace(/\/admin(\/.*)?$/, '');
      window.location.replace(base + '/admin.html' + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
  <p>جاري تحويلك إلى لوحة التحكم...</p>
  <p>
    <a href="../admin.html" onclick="var b = window.location.pathname.replace(/\/admin(\/.*)?$/, ''); window.location.href = b + '/admin.html'; return false;">
      اضغط هنا إذا لم يتم تحويلك تلقائياً
    </a>
  </p>
</body>
</html>
